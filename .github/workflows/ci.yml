# Portable checks only. GitHub-hosted runners have no hardware GPU, so the
# hardware suite (crates/pigment-gpu/tests/gpu_hardware.rs, #[ignore]) is run
# manually with scripts/gpu-tests.sh on a real GPU; see CONTRIBUTING.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  portable:
    name: portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Tier 0/1 determinism (seeds, scene checksums) is checked on all three.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same toolchain as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (GPU suite is ignored and reported as such)
        run: cargo test --workspace --locked
      # Independent stdlib-only reference for the tier-0 seed vectors.
      - name: Seed vectors match the reference implementation
        if: runner.os == 'Linux'
        run: python3 scripts/seed-vectors.py --check
